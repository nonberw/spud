# A tabletop for synthetic data: three object classes scattered under an overhead camera.
name: blocks
terrain: {type: flat, size: [4, 4]}
light: studio
objects:
  - {type: box, size: [0.03, 0.03, 0.03], count: 8, region: [[-0.4, -0.4], [0.4, 0.4]], class: cube}
  - {type: sphere, radius: 0.035, count: 5, region: [[-0.4, -0.4], [0.4, 0.4]], class: ball}
  - {type: cylinder, size: [0.025, 0.05], count: 5, region: [[-0.4, -0.4], [0.4, 0.4]], class: can}
sensors:
  - {type: camera, name: top, pos: [0, -1.1, 1.3], lookat: [0, 0, 0], width: 320, height: 240}
