# Minimal scene for driving a robot from ROS 2: one dog standing still until /zoomie0/cmd_vel says go.
name: ros_demo
quality: potato
terrain: {type: flat, size: [30, 30]}
light: day
robots:
  - {type: zoomie, count: 1, pos: [0, 0, 0], command: [0, 0, 0]}
objects:
  - {type: box, size: [0.1, 3, 0.5], pos: [4, 0, 0.5], static: true, random_yaw: false, class: wall}
  - {type: box, size: [3, 0.1, 0.5], pos: [0, 3, 0.5], static: true, random_yaw: false, class: wall}
sensors:
  - {type: lidar, name: scan, robot: zoomie0, rays: 360, range: 10, noise: true}
  - {type: imu, name: imu, robot: zoomie0, noise: true}
  - {type: camera, name: front, robot: zoomie0, width: 160, height: 120}
