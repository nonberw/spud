name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for headless MuJoCo rendering
        run: sudo apt-get update && sudo apt-get install -y libosmesa6-dev
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" mitsuba roslibpy
      - name: Tests (GPU tests skip themselves without CUDA)
        run: pytest -q

  ros2-live:
    # The real thing: ROS 2 Jazzy + rosbridge in Docker, SPUD publishing a scene into it,
    # and ROS-side checks of topics, message types, rates, data, and cmd_vel driving a robot.
    runs-on: ubuntu-24.04
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start ROS 2 Jazzy + rosbridge
        run: |
          docker build -t spud-ros2 docker/ros2
          docker run -d --name ros -p 9090:9090 spud-ros2
      - name: Install SPUD (CPU torch)
        run: |
          sudo apt-get update && sudo apt-get install -y libosmesa6-dev
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ros]"
      - name: Wait for rosbridge
        run: |
          for i in $(seq 1 60); do (echo > /dev/tcp/localhost/9090) 2>/dev/null && exit 0; sleep 2; done
          docker logs ros; exit 1
      - name: Publish a scene into ROS 2
        run: |
          nohup spud ros examples/ros_demo.yaml --transport rosbridge --url ws://localhost:9090 --seconds 600 > spud_ros.log 2>&1 &
          sleep 25
          cat spud_ros.log
      - name: Check from inside ROS 2
        run: |
          docker cp docker/ros2/check.sh ros:/check.sh
          docker exec ros bash /check.sh
      - name: Logs
        if: always()
        run: |
          cat spud_ros.log || true
          docker logs ros | tail -50 || true
