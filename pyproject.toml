[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spud"
version = "0.1.0"
description = "Run big robot simulations and models too big for your GPU on a potato: layer streaming, planner, mass simulation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nonberw" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.2",
  "torch>=2.2",
  "pillow>=10.0",
  "zoomies @ git+https://github.com/nonberw/zoomies",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
spud = "spud.cli:main"

[project.urls]
Homepage = "https://github.com/nonberw/spud"

[tool.setuptools]
packages = ["spud"]

[tool.setuptools.package-data]
spud = ["assets/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
