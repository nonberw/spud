[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spud"
version = "0.4.0"
description = "Isaac-lite for weak laptops: train robots with RL, teleop them from your phone, record demos, clone them; YAML scenes, sensors, datasets, ROS 2, plus layer streaming and 65k-robot simulation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "nonberw" }]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "mujoco>=3.2",
  "torch>=2.2",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "h5py>=3.8",
  "armageddon @ git+https://github.com/nonberw/armageddon",
  "zoomies @ git+https://github.com/nonberw/zoomies",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8"]
gpu = ["mujoco-warp>=3.17"]
photoreal = ["mitsuba>=3.6"]
ros = ["roslibpy>=2.0"]
onnx = ["onnx>=1.16"]

[project.scripts]
spud = "spud.cli:main"

[project.urls]
Homepage = "https://github.com/nonberw/spud"

[tool.setuptools]
packages = ["spud"]

[tool.setuptools.package-data]
spud = ["assets/*.pt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
